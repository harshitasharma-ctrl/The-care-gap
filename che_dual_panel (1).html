<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Health Expenditure — The Care Gap</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #2C2C2A;
    padding: 20px 16px 24px;
  }
  .panel-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 16px; }
  .panel-title { font-size: 13px; font-weight: 500; color: #2C2C2A; margin-bottom: 12px; }
  .legend-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .leg-btn {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: #2C2C2A;
    cursor: pointer; padding: 3px 8px;
    border-radius: 4px; border: 0.5px solid transparent;
    background: none; user-select: none; transition: opacity 0.2s;
  }
  .leg-btn:hover { border-color: #9FE1CB; }
  .leg-btn.hidden { opacity: 0.35; text-decoration: line-through; }
  .legend-sq { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .chart-container { position: relative; width: 100%; height: 240px; }
  @media (max-width: 600px) {
    .panel-wrap { grid-template-columns: 1fr; }
    .chart-container { height: 200px; }
  }
</style>
</head>
<body>

<div class="legend-row" id="legendRow">
  <button class="leg-btn" data-key="high" onclick="toggleSeries('high')">
    <span class="legend-sq" style="background:#1D9E75;"></span>High-income
  </button>
  <button class="leg-btn" data-key="low" onclick="toggleSeries('low')">
    <span class="legend-sq" style="background:#085041;"></span>Low-income
  </button>
  <button class="leg-btn" data-key="lm" onclick="toggleSeries('lm')">
    <span class="legend-sq" style="background:#9FE1CB;"></span>Lower-middle-income
  </button>
</div>

<div class="panel-wrap">
  <div>
    <div class="panel-title">Panel A — CHE as % of GDP</div>
    <div class="chart-container">
      <canvas id="chartA" role="img" aria-label="Line chart of current health expenditure as percentage of GDP 2000 to 2022 for three income groups">
        CHE % GDP: High income 6.36% to 8.06%. Low income 4.31% to 6.38%. Lower-middle 4.53% to 5.41%.
      </canvas>
    </div>
  </div>
  <div>
    <div class="panel-title">Panel B — CHE per capita (US$)</div>
    <div class="chart-container">
      <canvas id="chartB" role="img" aria-label="Line chart of current health expenditure per capita in US dollars 2000 to 2022 for three income groups">
        CHE per capita: High income $1,118 to $3,528. Low income $17 to $45. Lower-middle $33 to $147.
      </canvas>
    </div>
  </div>
</div>

<script>
const years = [2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022];

const gdpData = {
  high: [6.36,6.44,6.72,6.80,6.74,6.68,6.61,6.68,7.02,7.59,7.57,7.38,7.38,7.35,7.29,7.39,7.54,7.57,7.50,7.72,8.56,8.31,8.06],
  low:  [4.31,4.49,4.63,4.75,4.77,4.75,4.71,4.68,4.65,5.04,5.05,4.92,5.20,5.23,5.42,5.62,6.01,6.08,6.05,6.17,6.87,6.88,6.38],
  lm:   [4.53,4.56,4.66,4.65,4.58,4.52,4.51,4.56,4.62,4.96,4.86,4.78,4.80,4.76,4.85,4.97,5.16,5.14,5.10,5.15,6.03,5.76,5.41]
};

const pcData = {
  high: [1118,1183,1229,1310,1412,1525,1641,1778,1889,1851,1970,2147,2246,2351,2484,2561,2690,2840,3004,3155,3259,3627,3528],
  low:  [17,17,17,17,18,19,20,21,22,21,23,25,26,27,28,27,27,28,30,32,33,41,45],
  lm:   [33,35,36,38,41,46,52,59,65,63,71,82,89,96,101,99,100,107,116,124,126,156,147]
};

const seriesConfig = [
  { key: 'high', label: 'High-income',        color: '#1D9E75', dash: [] },
  { key: 'low',  label: 'Low-income',          color: '#085041', dash: [5,3] },
  { key: 'lm',   label: 'Lower-middle-income', color: '#9FE1CB', dash: [5,3] }
];

const hidden = { high: false, low: false, lm: false };
let chartA, chartB;

function buildDatasets(dataObj) {
  return seriesConfig.map(s => ({
    label: s.label,
    data: dataObj[s.key],
    borderColor: s.color,
    borderDash: s.dash,
    borderWidth: 2,
    pointRadius: 0,
    tension: 0.3,
    fill: false,
    hidden: hidden[s.key]
  }));
}

function makeChart(id, dataObj, tickFmt) {
  return new Chart(document.getElementById(id), {
    type: 'line',
    data: { labels: years, datasets: buildDatasets(dataObj) },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          mode: 'index',
          intersect: false,
          callbacks: {
            label: c => ' ' + c.dataset.label + ': ' + tickFmt(c.raw)
          }
        }
      },
      scales: {
        x: {
          ticks: { font: { size: 10 }, color: '#2C2C2A', maxRotation: 0, autoSkip: true, maxTicksLimit: 7 },
          grid: { display: false }, border: { display: false }
        },
        y: {
          ticks: { font: { size: 10 }, color: '#2C2C2A', callback: tickFmt },
          grid: { color: 'rgba(136,135,128,0.15)' }, border: { display: false }
        }
      }
    }
  });
}

chartA = makeChart('chartA', gdpData, v => v.toFixed(1) + '%');
chartB = makeChart('chartB', pcData, v => '$' + v.toLocaleString());

function toggleSeries(key) {
  hidden[key] = !hidden[key];
  [chartA, chartB].forEach(chart => {
    const idx = seriesConfig.findIndex(s => s.key === key);
    chart.data.datasets[idx].hidden = hidden[key];
    chart.update();
  });
  const btn = document.querySelector(`.leg-btn[data-key="${key}"]`);
  btn.classList.toggle('hidden', hidden[key]);
}
</script>
</body>
</html>
