<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: #fff;
  color: #111;
  padding: 24px 28px 20px;
  max-width: 880px;
  margin: 0 auto;
}

.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 10px;
}

.tabs { display: flex; gap: 4px; }
.tab {
  padding: 6px 14px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  background: none;
  color: #888;
  border: none;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.tab.active { color: #085041; border-bottom: 2px solid #085041; }
.tab:hover:not(.active) { color: #333; }

.chart-wrap { position: relative; height: 370px; }

/* Legend — horizontal row of coloured line samples */
.legend {
  display: flex;
  gap: 22px;
  margin-top: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #333;
}
.legend-line {
  width: 28px;
  height: 2.5px;
  border-radius: 2px;
}
.legend-line.dashed {
  background: repeating-linear-gradient(
    90deg,
    var(--c) 0, var(--c) 5px,
    transparent 5px, transparent 9px
  );
}
.covid-note {
  margin-left: auto;
  font-size: 11px;
  color: #9993CC;
  font-style: italic;
}
</style>
</head>
<body>

<div class="top-row">
  <div class="tabs">
    <div class="tab active" onclick="setMeasure('dalys',this)">DALYs rate (ASDR)</div>
    <div class="tab" onclick="setMeasure('prevalence',this)">Prevalence rate (ASPR)</div>
    <div class="tab" onclick="setMeasure('incidence',this)">Incidence rate (ASIR)</div>
  </div>
</div>

<div class="chart-wrap">
  <canvas id="chart"></canvas>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-line" style="background:#085041"></div>
    Both sexes
  </div>
  <div class="legend-item">
    <div class="legend-line" style="background:#1D9E75"></div>
    Female
  </div>
  <div class="legend-item">
    <div class="legend-line dashed" style="--c:#7F77DD; background: repeating-linear-gradient(90deg, #7F77DD 0, #7F77DD 5px, transparent 5px, transparent 9px)"></div>
    Male
  </div>
  <div class="covid-note">▌ COVID-19 period (from 2020)</div>
</div>

<script>
const DATA = {"dalys":{"Female":{"values":[1374.9,1384.3,1392.8,1386.0,1405.2,1407.3,1413.5,1427.7,1434.2,1443.8,1457.3,1461.9,1474.9,1482.3,1490.1,1501.3,1510.3,1519.7,1533.3,1544.1,1556.6,1572.3,1585.8,1600.3,1621.2,1640.8,1660.8,1680.1,1694.6,1712.2,1996.0,2027.3,2050.9,2190.3]},"Male":{"values":[1384.5,1391.6,1397.3,1390.3,1403.7,1402.9,1405.8,1413.9,1416.4,1420.8,1428.8,1429.2,1436.1,1438.9,1442.6,1448.8,1454.3,1459.0,1467.6,1473.6,1480.6,1489.9,1497.6,1507.4,1520.7,1532.2,1542.6,1553.3,1563.3,1575.1,1765.0,1783.7,1797.3,1889.9]},"Both":{"values":[1379.9,1388.1,1395.1,1388.2,1404.4,1405.1,1409.5,1420.6,1425.1,1432.0,1442.7,1445.2,1455.1,1460.2,1465.9,1474.5,1481.8,1488.8,1499.9,1508.3,1518.0,1530.5,1541.1,1553.3,1570.4,1585.9,1601.1,1616.0,1628.3,1643.0,1879.4,1904.4,1923.0,2038.8]}},"prevalence":{"Female":{"values":[9709.0,9761.6,9808.3,9784.6,9879.4,9895.3,9927.9,9993.2,10022.3,10067.0,10131.1,10149.1,10200.1,10225.4,10253.3,10302.1,10347.3,10401.1,10473.7,10539.7,10612.7,10697.9,10773.3,10855.8,10976.0,11101.6,11227.2,11336.0,11419.8,11524.4,13251.5,13496.0,13686.7,14686.6]},"Male":{"values":[10407.5,10446.4,10477.9,10451.4,10514.2,10514.4,10526.8,10557.3,10561.3,10572.6,10599.7,10590.1,10600.9,10592.2,10589.1,10606.9,10628.4,10649.7,10691.6,10720.6,10754.5,10802.4,10846.1,10902.0,10975.2,11039.8,11091.6,11135.4,11180.8,11237.9,12343.8,12475.5,12576.7,13209.4]},"Both":{"values":[10066.6,10112.2,10151.2,10126.1,10204.5,10212.3,10234.5,10282.0,10298.1,10325.6,10370.7,10374.4,10404.8,10412.6,10424.6,10457.5,10490.4,10527.6,10584.4,10631.6,10684.6,10750.9,10810.1,10879.2,10975.6,11070.4,11158.7,11234.7,11299.1,11379.7,12793.4,12981.2,13126.9,13941.7]}},"incidence":{"Female":{"values":[4321.7,4394.5,4515.1,4341.7,4476.2,4458.0,4492.4,4581.5,4590.2,4594.1,4678.1,4661.2,4731.6,4729.0,4739.4,4794.4,4844.0,4841.5,4891.1,4918.7,4962.0,5035.9,5057.6,5072.0,5150.8,5202.9,5243.9,5288.8,5307.8,5346.9,8660.3,8824.2,6990.9,5467.9]},"Male":{"values":[3590.1,3638.2,3721.7,3573.8,3665.8,3636.4,3657.6,3706.2,3703.1,3689.0,3747.1,3724.4,3770.0,3752.9,3748.9,3779.4,3809.9,3791.8,3814.2,3808.7,3831.5,3883.6,3889.2,3881.0,3920.7,3948.5,3973.4,3995.4,3997.0,4016.4,6252.1,6369.2,5144.5,4090.0]},"Both":{"values":[3947.1,4007.2,4108.8,3948.4,4061.2,4037.3,4065.0,4133.5,4136.3,4131.1,4202.1,4182.5,4240.5,4230.8,4234.2,4277.1,4317.4,4307.5,4343.7,4355.1,4388.5,4451.8,4465.9,4469.4,4528.7,4568.8,4601.9,4635.4,4645.8,4675.1,7444.8,7585.7,6059.7,4773.0]}}};

const YLABELS = { dalys:'ASDR per 100,000', prevalence:'ASPR per 100,000', incidence:'ASIR per 100,000' };
const YEARS = Array.from({length:34},(_,i)=>String(1990+i));

let measure = 'dalys';

const covidPlugin = {
  id:'covid',
  beforeDraw(chart) {
    const {ctx,chartArea,scales} = chart;
    if (!chartArea) return;
    const x0 = scales.x.getPixelForValue('2020');
    ctx.save();
    ctx.fillStyle = 'rgba(127,119,221,0.07)';
    ctx.fillRect(x0, chartArea.top, chartArea.right-x0, chartArea.height);
    ctx.strokeStyle = 'rgba(127,119,221,0.4)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(x0,chartArea.top); ctx.lineTo(x0,chartArea.bottom); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
};

function mkDatasets(m) {
  return [
    { label:'Both sexes', data:DATA[m].Both.values,  borderColor:'#085041', borderWidth:2,   borderDash:[],    tension:0.35, pointRadius:0, pointHoverRadius:5 },
    { label:'Female',     data:DATA[m].Female.values, borderColor:'#1D9E75', borderWidth:1.8, borderDash:[],    tension:0.35, pointRadius:0, pointHoverRadius:5 },
    { label:'Male',       data:DATA[m].Male.values,   borderColor:'#7F77DD', borderWidth:1.8, borderDash:[6,3], tension:0.35, pointRadius:0, pointHoverRadius:5 },
  ];
}

const chart = new Chart(document.getElementById('chart').getContext('2d'), {
  type:'line',
  data:{ labels:YEARS, datasets:mkDatasets('dalys') },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    interaction:{ mode:'index', intersect:false },
    plugins:{
      legend:{ display:false },
      tooltip:{
        backgroundColor:'#fff',
        borderColor:'#e0e0e0',
        borderWidth:1,
        titleColor:'#333',
        bodyColor:'#333',
        padding:10,
        titleFont:{ family:'IBM Plex Sans', size:12, weight:'500' },
        bodyFont:{ family:'IBM Plex Sans', size:12 },
        callbacks:{
          title: i => `Year: ${i[0].label}`,
          label: i => ` ${i.dataset.label}: ${i.raw.toLocaleString(undefined,{maximumFractionDigits:1})} per 100,000`
        }
      }
    },
    scales:{
      x:{
        ticks:{ maxTicksLimit:9, color:'#555', font:{ family:'IBM Plex Sans', size:11 } },
        grid:{ display:false },
        border:{ color:'#bbb' }
      },
      y:{
        ticks:{ color:'#555', font:{ family:'IBM Plex Sans', size:11 }, callback: v=>v.toLocaleString() },
        grid:{ color:'#efefef' },
        border:{ color:'#bbb' },
        title:{ display:true, text:YLABELS.dalys, color:'#555', font:{ family:'IBM Plex Sans', size:11 } }
      }
    }
  },
  plugins:[covidPlugin]
});

function setMeasure(m, el) {
  measure = m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  chart.data.datasets = mkDatasets(m);
  chart.options.scales.y.title.text = YLABELS[m];
  chart.update();
}
</script>
</body>
</html>
