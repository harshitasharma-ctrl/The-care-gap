<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: #fff;
  color: #111;
  padding: 24px 28px 20px;
  max-width: 860px;
  margin: 0 auto;
}
.chart-wrap { position: relative; height: 400px; }
</style>
</head>
<body>
<div class="chart-wrap">
  <canvas id="chart"></canvas>
</div>

<script>
const labels = ['LIC','LMIC','HIC','AFR','SEAR','EMR','WPR','AMR','EUR'];
const values = [0.6, 1.0, 4.3, 0.6, 1.1, 1.8, 1.3, 2.1, 4.5];
const colors = ['#7F77DD','#1D9E75','#085041','#C5A0D8','#9FD4E8','#E8B89F','#9FD4B8','#E8D49F','#9FA8D8'];
const xPos   = [0, 1, 2, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5];

const whoMinPlugin = {
  id:'whomin',
  afterDraw(chart) {
    const {ctx,chartArea,scales} = chart;
    const y5 = scales.y.getPixelForValue(5);
    ctx.save();
    ctx.strokeStyle='#085041'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(chartArea.left,y5); ctx.lineTo(chartArea.right,y5); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#085041';
    ctx.font="italic 11px 'IBM Plex Sans',sans-serif";
    ctx.textAlign='right';
    ctx.fillText('WHO minimum (5%)', chartArea.right-4, y5-6);
    ctx.restore();
  }
};

const dividerPlugin = {
  id:'divider',
  afterDraw(chart) {
    const {ctx,chartArea,scales} = chart;
    const x2 = scales.x.getPixelForValue(2);
    const x3 = scales.x.getPixelForValue(3.5);
    const xMid = (x2+x3)/2;
    ctx.save();
    ctx.strokeStyle='#ccc'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(xMid,chartArea.top); ctx.lineTo(xMid,chartArea.bottom); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#888';
    ctx.font="600 10px 'IBM Plex Sans',sans-serif";
    ctx.textAlign='center';
    ctx.fillText('BY INCOME GROUP', (chartArea.left+xMid)/2, chartArea.top-10);
    ctx.fillText('BY WHO REGION',   (xMid+chartArea.right)/2, chartArea.top-10);
    ctx.restore();
  }
};

const valueLabels = {
  id:'valuelabels',
  afterDatasetsDraw(chart) {
    const {ctx,scales} = chart;
    chart.data.datasets[0].data.forEach((val,i) => {
      const x = scales.x.getPixelForValue(xPos[i]);
      const y = scales.y.getPixelForValue(val);
      ctx.save();
      ctx.fillStyle='#333';
      ctx.font="500 11px 'IBM Plex Sans',sans-serif";
      ctx.textAlign='center';
      ctx.fillText(val+'%', x, y-6);
      ctx.restore();
    });
  }
};

new Chart(document.getElementById('chart').getContext('2d'), {
  type:'bar',
  data:{
    labels: xPos.map(String),
    datasets:[{
      data: values,
      backgroundColor: colors,
      borderWidth: 0,
      barThickness: 40,
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    layout:{ padding:{ top:28, right:10 } },
    plugins:{
      legend:{ display:false },
      tooltip:{
        backgroundColor:'#fff', borderColor:'#e0e0e0', borderWidth:1,
        titleColor:'#333', bodyColor:'#333', padding:10,
        titleFont:{family:'IBM Plex Sans',size:11,weight:'500'},
        bodyFont:{family:'IBM Plex Sans',size:11},
        callbacks:{
          title: items => labels[items[0].dataIndex],
          label: item => ` ${item.raw}% of government health expenditure`
        }
      }
    },
    scales:{
      x:{
        type:'linear',
        min:-0.6,
        max:9.1,
        ticks:{
          color:'#333',
          font:{family:'IBM Plex Sans',size:12,weight:'500'},
          callback: val => {
            const idx = xPos.indexOf(val);
            return idx !== -1 ? labels[idx] : '';
          },
          maxRotation:0, minRotation:0, autoSkip:false, stepSize:0.5
        },
        grid:{ display:false },
        border:{ color:'#bbb' }
      },
      y:{
        min:0, max:6.5,
        ticks:{ color:'#555', font:{family:'IBM Plex Sans',size:11}, callback:v=>v+'%' },
        grid:{ color:'#efefef' },
        border:{ color:'#bbb' },
        title:{ display:true, text:'% of government health expenditure (median)', color:'#555', font:{family:'IBM Plex Sans',size:11} }
      }
    }
  },
  plugins:[whoMinPlugin, dividerPlugin, valueLabels]
});
</script>
</body>
</html>
