<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: #fff;
  color: #111;
  padding: 24px 28px 20px;
  max-width: 860px;
  margin: 0 auto;
}
.chart-wrap { position: relative; height: 380px; }
.legend {
  display: flex;
  gap: 24px;
  margin-top: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #333; }
.legend-line { width: 26px; height: 2.5px; border-radius: 2px; flex-shrink: 0; }
.covid-note { margin-left: auto; font-size: 11px; color: #9993CC; font-style: italic; }
</style>
</head>
<body>

<div class="chart-wrap">
  <canvas id="chart"></canvas>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-line" style="background:#085041"></div>
    LMICs
  </div>
  <div class="legend-item">
    <div class="legend-line" style="background:#1D9E75; background: repeating-linear-gradient(90deg,#1D9E75 0,#1D9E75 5px,transparent 5px,transparent 9px)"></div>
    High-income countries
  </div>
  <div class="legend-item">
    <div class="legend-line" style="background:#7F77DD; background: repeating-linear-gradient(90deg,#7F77DD 0,#7F77DD 3px,transparent 3px,transparent 7px)"></div>
    Global
  </div>
  <div class="covid-note">▌ COVID-19 period (from 2020)</div>
</div>

<script>
const YEARS = Array.from({length:34},(_,i)=>String(1990+i));

const LMIC   = [304.5,308.3,311.5,306.5,314.9,314.6,316.7,322.2,323.6,327.3,334.1,334.7,340.5,343.9,348.1,354.4,359.3,362.8,369.6,374.2,379.3,386.8,391.3,396.0,404.3,409.5,414.8,421.4,425.9,411.5,521.5,527.8,490.0,665.0];
const HIC    = [535.4,541.0,545.5,537.5,549.5,547.5,549.1,557.1,558.7,562.0,569.0,568.0,574.5,576.1,577.5,581.6,583.9,583.8,588.7,590.4,591.5,595.0,595.1,596.5,601.6,601.6,599.8,601.1,601.5,569.1,672.9,672.0,648.6,798.6];
const GLOBAL = [405.0,409.3,412.7,406.2,416.2,415.0,416.7,423.7,424.9,428.0,435.5,435.0,441.1,443.5,446.2,451.6,454.9,456.5,462.1,465.0,468.1,473.9,475.9,478.2,485.4,487.4,488.7,492.8,495.3,465.9,564.4,564.6,536.1,686.5];

const covidPlugin = {
  id:'covid',
  beforeDraw(chart) {
    const {ctx,chartArea,scales} = chart;
    if (!chartArea) return;
    const x0 = scales.x.getPixelForValue('2020');
    ctx.save();
    ctx.fillStyle='rgba(127,119,221,0.07)';
    ctx.fillRect(x0,chartArea.top,chartArea.right-x0,chartArea.height);
    ctx.strokeStyle='rgba(127,119,221,0.4)'; ctx.lineWidth=1.2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(x0,chartArea.top); ctx.lineTo(x0,chartArea.bottom); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
};

// Annotation labels at end of lines
const labelPlugin = {
  id:'endlabels',
  afterDatasetsDraw(chart) {
    const {ctx,scales} = chart;
    chart.data.datasets.forEach((ds,i) => {
      const last = ds.data[ds.data.length-1];
      const x = scales.x.getPixelForValue('2023') + 4;
      const y = scales.y.getPixelForValue(last);
      ctx.save();
      ctx.font = "500 11px 'IBM Plex Sans', sans-serif";
      ctx.fillStyle = ds.borderColor;
      ctx.textBaseline = 'middle';
      ctx.fillText(`+${Math.round((last/ds.data[0]-1)*100)}%`, x, y);
      ctx.restore();
    });
  }
};

new Chart(document.getElementById('chart').getContext('2d'), {
  type:'line',
  data:{
    labels:YEARS,
    datasets:[
      { label:'LMICs',                data:LMIC,   borderColor:'#085041', borderWidth:2.2, borderDash:[],    tension:0.35, pointRadius:0, pointHoverRadius:5 },
      { label:'High-income countries',data:HIC,    borderColor:'#1D9E75', borderWidth:1.8, borderDash:[6,3], tension:0.35, pointRadius:0, pointHoverRadius:5 },
      { label:'Global',               data:GLOBAL, borderColor:'#7F77DD', borderWidth:1.6, borderDash:[3,3], tension:0.35, pointRadius:0, pointHoverRadius:5 },
    ]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    layout:{ padding:{ right:48 } },
    interaction:{ mode:'index', intersect:false },
    plugins:{
      legend:{ display:false },
      tooltip:{
        backgroundColor:'#fff', borderColor:'#e0e0e0', borderWidth:1,
        titleColor:'#333', bodyColor:'#333', padding:10,
        titleFont:{family:'IBM Plex Sans',size:11,weight:'500'},
        bodyFont:{family:'IBM Plex Sans',size:11},
        callbacks:{
          title: i=>`Year: ${i[0].label}`,
          label: i=>` ${i.dataset.label}: ${i.raw.toLocaleString(undefined,{maximumFractionDigits:1})} per 100,000`
        }
      }
    },
    scales:{
      x:{
        ticks:{ maxTicksLimit:9, color:'#555', font:{family:'IBM Plex Sans',size:11} },
        grid:{ display:false },
        border:{ color:'#bbb' }
      },
      y:{
        ticks:{ color:'#555', font:{family:'IBM Plex Sans',size:11}, callback:v=>v.toLocaleString() },
        grid:{ color:'#efefef' },
        border:{ color:'#bbb' },
        title:{ display:true, text:'ASDR per 100,000', color:'#555', font:{family:'IBM Plex Sans',size:11} }
      }
    }
  },
  plugins:[covidPlugin, labelPlugin]
});
</script>
</body>
</html>
