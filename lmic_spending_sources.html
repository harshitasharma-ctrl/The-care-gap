<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMIC Health Spending Sources — The Care Gap</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #2c2c2a;
    padding: 20px 16px 24px;
  }
  .legend-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #2C2C2A;
  }
  .legend-sq {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .chart-container {
    position: relative;
    width: 100%;
    height: 380px;
  }
  @media (max-width: 500px) {
    .chart-container { height: 300px; }
  }
</style>
</head>
<body>

<div class="legend-row">
  <span class="legend-item">
    <span class="legend-sq" style="background:#085041;"></span>Government
  </span>
  <span class="legend-item">
    <span class="legend-sq" style="background:#1D9E75;"></span>Prepaid private
  </span>
  <span class="legend-item">
    <span class="legend-sq" style="background:#7F77DD;"></span>Development assistance (DAH)
  </span>
  <span class="legend-item">
    <span class="legend-sq" style="background:#CECBF6;border:1px solid #AFA9EC;"></span>Out-of-pocket
  </span>
</div>

<div class="chart-container">
  <canvas id="stackedChart" role="img" aria-label="Stacked bar chart showing sources of health expenditure as percentage of total health spending for lower-middle-income countries from 1995 to 2021. Out-of-pocket spending dominates, falling from 56% in 1995 to 47% in 2021. Government spending rose from 36% to 37%.">
    LMIC health spending sources 1995–2021: OOP fell from 56% to 47%; Government rose from 36% to 37%; Prepaid private rose from 6% to 9%; DAH fluctuated 3–7%.
  </canvas>
</div>

<script>
const years = [1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021];
const govt  = [35.7,34.6,34.3,33.5,32.7,32.5,32.6,32.8,32.6,32.3,32.6,33.1,33.4,34.1,34.5,34.0,34.1,34.1,33.7,34.3,34.8,35.2,35.9,36.6,37.1,38.1,37.1];
const ppp   = [5.6,5.6,5.6,5.7,5.7,6.0,6.0,6.1,6.2,6.2,6.1,5.9,6.1,6.2,6.5,6.7,7.0,7.3,7.5,7.8,8.1,8.6,9.0,9.3,9.5,9.0,9.0];
const dah   = [2.9,3.1,2.7,2.8,3.1,3.2,2.9,2.7,2.9,3.5,3.9,3.9,3.9,4.6,4.4,4.4,4.2,4.3,4.7,3.8,3.6,3.6,3.8,3.5,3.3,5.8,7.2];
const oop   = [55.7,56.7,57.4,58.0,58.5,58.4,58.5,58.4,58.4,58.1,57.4,57.0,56.5,55.1,54.6,54.9,54.6,54.4,54.2,54.1,53.4,52.7,51.3,50.6,50.2,47.1,46.8];

new Chart(document.getElementById('stackedChart'), {
  type: 'bar',
  data: {
    labels: years,
    datasets: [
      { label: 'Government',                   data: govt, backgroundColor: '#085041', stack: 'a' },
      { label: 'Prepaid private',              data: ppp,  backgroundColor: '#1D9E75', stack: 'a' },
      { label: 'Development assistance (DAH)', data: dah,  backgroundColor: '#7F77DD', stack: 'a' },
      { label: 'Out-of-pocket',                data: oop,  backgroundColor: '#CECBF6', stack: 'a' }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          title: ctx => 'Year: ' + ctx[0].label,
          label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '%'
        }
      }
    },
    scales: {
      x: {
        stacked: true,
        grid: { display: false },
        ticks: {
          font: { size: 11 },
          color: '#2C2C2A',
          autoSkip: false,
          maxRotation: 45,
          callback: (val, i) => i % 2 === 0 ? years[i] : ''
        }
      },
      y: {
        stacked: true,
        min: 0,
        max: 100,
        ticks: {
          font: { size: 11 },
          color: '#2C2C2A',
          callback: v => v + '%'
        },
        grid: { color: 'rgba(136,135,128,0.15)' }
      }
    }
  }
});
</script>
</body>
</html>
