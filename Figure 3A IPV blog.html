<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 3A</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: #fff;
  color: #111;
  padding: 24px 28px 20px;
  max-width: 860px;
  margin: 0 auto;
}
.chart-wrap { position: relative; height: 420px; }
@media (max-width: 560px) {
  body { padding: 16px 12px 14px; }
}
</style>
</head>
<body>
<div class="chart-wrap"><canvas id="chart"></canvas></div>

<script>
const FONT = "'IBM Plex Sans', sans-serif";
const labels = [
  ['Interpersonal', 'violence'],
  'Self-harm',
  ['Anxiety', 'disorders'],
  ['Depressive', 'disorders'],
  ['HIV/AIDS &', 'STIs'],
  ['Maternal &', 'neonatal disorders']
];
const values = [34.5, 27.0, 16.2, 11.7, 7.7, 0.4];
const colors = ['#085041', '#1D9E75', '#4A90A4', '#7F77DD', '#1A5276', '#9FD4E8'];

const valueLabels = {
  id: 'valuelabels',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    const meta = chart.getDatasetMeta(0);
    ctx.save();
    ctx.fillStyle = '#333';
    ctx.font = `500 ${chart.width < 500 ? 11 : 13}px ${FONT}`;
    ctx.textBaseline = 'middle';
    meta.data.forEach((bar, i) => ctx.fillText(values[i].toFixed(1) + '%', bar.x + 7, bar.y));
    ctx.restore();
  }
};

document.fonts.ready.then(() => new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: {
    labels,
    datasets: [{
      label: 'Share of female DALYs attributable to IPV',
      data: values,
      backgroundColor: colors,
      hoverBackgroundColor: colors.map(c => c + 'D9'),
      categoryPercentage: 0.55,
      barPercentage: 1.0
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 700 },
    layout: { padding: { right: 8 } },
    scales: {
      x: {
        min: 0, max: 40,
        ticks: { stepSize: 5, font: { family: FONT, size: 11 }, color: '#333' },
        grid: { color: '#eee' },
        border: { display: false },
        title: { display: true, text: 'Share of total female DALYs attributable to intimate partner violence (%)',
                 font: { family: FONT, size: 12 }, color: '#444' }
      },
      y: {
        ticks: { font: { family: FONT, size: 12 }, color: '#333' },
        grid: { display: false },
        border: { display: false },
        title: { display: true, text: 'Health condition', font: { family: FONT, size: 12 }, color: '#444' }
      }
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#fff',
        borderColor: '#ccc',
        borderWidth: 1,
        titleColor: '#111',
        bodyColor: '#333',
        titleFont: { family: FONT, weight: '600', size: 12 },
        bodyFont: { family: FONT, size: 12 },
        padding: 10,
        boxPadding: 4,
        callbacks: {
          title: items => [].concat(labels[items[0].dataIndex]).join(' '),
          label: item => `${item.parsed.x.toFixed(1)}% of female DALYs attributable to IPV`
        }
      }
    }
  },
  plugins: [valueLabels]
}));
</script>
</body>
</html>
