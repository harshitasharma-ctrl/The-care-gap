<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preston's decomposition of the rise in world life expectancy, 1938-1963</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #333; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 12px 12px 8px; position: relative; }
  svg { width: 100%; height: auto; display: block; font-family: 'IBM Plex Sans', Arial, sans-serif; }
  .pt { cursor: pointer; }
  .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid #ccc; border-radius: 4px;
         padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 2px 6px rgba(0,0,0,.08); opacity: 0; transition: opacity .1s; max-width: 240px; }
  .tip b { color: #111; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="fig" viewBox="0 0 860 470" role="img" aria-label="Schematic of Preston's decomposition: world life expectancy rose from 44.2 years in 1938 to 56.4 years in 1963; 2.5 years came from income growth along the 1930s curve and 9.7 years from the upward shift of the curve"></svg>
  <div class="tip" id="tip"></div>
</div>
<script>
// Schematic. The four life expectancy values are Preston's (1975, Table 1) estimates;
// the curve shapes and income positions are illustrative.
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('fig');
const M = { l: 70, r: 30, t: 20, b: 52 };
const W = 860, H = 470, PW = W - M.l - M.r, PH = H - M.t - M.b;
const Y0 = 35, Y1 = 62;
const sx = x => M.l + x * PW;                 // x in [0,1], illustrative income
const sy = y => M.t + (Y1 - y) / (Y1 - Y0) * PH;

// Illustrative log-shaped curves passing through Preston's values
const X38 = 0.12, X63 = 0.27;
const k30 = 2.5 / Math.log(X63 / X38), c30 = 44.2 - k30 * Math.log(X38);   // 1930s: 44.2 -> 46.7
const k60 = 1.99, c60 = 56.4 - k60 * Math.log(X63);                         // 1960s: passes 56.4
const f30 = x => c30 + k30 * Math.log(x), f60 = x => c60 + k60 * Math.log(x);

const C = { c60: '#085041', c30: '#8FB8AC', inc: '#4A90A4', shift: '#1D9E75', text: '#333', muted: '#555', grid: '#eee' };

function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e); return e;
}
function text(x, y, str, attrs = {}) {
  const t = el('text', Object.assign({ x, y, fill: C.text, 'font-size': 13 }, attrs));
  [].concat(str).forEach((line, i) => {
    const s = el('tspan', { x, dy: i === 0 ? 0 : '1.25em' }, t); s.textContent = line;
  });
  return t;
}
function curve(f, x0, x1) {
  let d = '';
  for (let i = 0; i <= 200; i++) { const x = x0 + (x1 - x0) * i / 200; d += (i ? 'L' : 'M') + sx(x).toFixed(1) + ',' + sy(f(x)).toFixed(1); }
  return d;
}

// defs: arrowheads
const defs = el('defs', {});
[['inc', C.inc], ['shift', C.shift]].forEach(([id, col]) => {
  const m = el('marker', { id: 'ah-' + id, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: col }, m);
});

// gridlines + y axis
[40, 45, 50, 55, 60].forEach(v => {
  el('line', { x1: M.l, x2: W - M.r, y1: sy(v), y2: sy(v), stroke: C.grid });
  text(M.l - 10, sy(v) + 4, String(v), { 'text-anchor': 'end', 'font-size': 12 });
});
el('line', { x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b, stroke: '#bbb' });
text(18, M.t + PH / 2, 'Life expectancy at birth (years)', { transform: `rotate(-90 18 ${M.t + PH / 2})`, 'text-anchor': 'middle', fill: '#444' });
text(M.l, H - M.b + 28, 'National income per head  →', { fill: '#444' });

// curves
el('path', { d: curve(f30, 0.025, 1), fill: 'none', stroke: C.c30, 'stroke-width': 3, 'stroke-dasharray': '9 7' });
el('path', { d: curve(f60, 0.04, 1), fill: 'none', stroke: C.c60, 'stroke-width': 3 });
text(W - M.r, sy(f60(1)) - 14, '1960s relationship', { 'text-anchor': 'end', fill: C.c60, 'font-weight': 500 });
text(W - M.r, sy(f30(1)) + 24, '1930s relationship', { 'text-anchor': 'end', fill: '#5E8A7E', 'font-weight': 500 });

// arrows
const pA = [sx(X38), sy(44.2)], pB = [sx(X63), sy(46.7)], pC = [sx(X63), sy(56.4)];
el('line', { x1: pA[0] + 6, y1: pA[1] - 2, x2: pB[0] - 9, y2: pB[1] + 3, stroke: C.inc, 'stroke-width': 3.5, 'marker-end': 'url(#ah-inc)' });
el('line', { x1: pB[0], y1: pB[1] - 9, x2: pC[0], y2: pC[1] + 11, stroke: C.shift, 'stroke-width': 3.5, 'marker-end': 'url(#ah-shift)' });

// arrow labels
el('rect', { x: pC[0] + 34, y: sy(53.4), width: 4, height: 34, fill: C.shift, rx: 1 });
text(pC[0] + 46, sy(53.4) + 14, ['Shift of the curve:', '+9.7 years'], { 'font-weight': 600, fill: '#111', 'font-size': 14 });
el('rect', { x: pC[0] + 64, y: sy(43.4), width: 4, height: 34, fill: C.inc, rx: 1 });
text(pC[0] + 76, sy(43.4) + 14, ['Income growth:', '+2.5 years'], { 'font-weight': 600, fill: '#111', 'font-size': 14 });

// points + labels
const tip = document.getElementById('tip'), wrap = document.querySelector('.wrap');
const pts = [
  { p: pA, lab: ['44.2 years', '(world, 1938)'], dx: 2, dy: 26, tip: '<b>World, 1938</b><br>Life expectancy: 44.2 years' },
  { p: pB, lab: ['46.7'], dx: 10, dy: 20, tip: '<b>1963 income on the 1930s curve</b><br>46.7 years: the gain from income growth alone (+2.5 years)' },
  { p: pC, lab: ['56.4 years', '(world, 1963)'], dx: 10, dy: -34, tip: '<b>World, 1963</b><br>Life expectancy: 56.4 years<br>Total gain since 1938: +12.2 years' }
];
pts.forEach(o => {
  const c = el('circle', { cx: o.p[0], cy: o.p[1], r: 6, fill: '#111', stroke: '#fff', 'stroke-width': 2, class: 'pt' });
  text(o.p[0] + o.dx, o.p[1] + o.dy, o.lab, { 'font-size': 13 });
  c.addEventListener('mousemove', e => {
    tip.innerHTML = o.tip;
    const r = wrap.getBoundingClientRect();
    let x = e.clientX - r.left + 14; if (x + 250 > r.width) x -= 264;
    tip.style.left = x + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; tip.style.opacity = 1;
  });
  c.addEventListener('mouseleave', () => tip.style.opacity = 0);
});
</script>
</body>
</html>
